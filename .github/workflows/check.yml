name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Local links, precache list, manifest and CDN references
        run: node tools/check-links.mjs

      - name: Size budget
        run: node tools/check-size.mjs

      - name: Version agreement
        run: node tools/check-version.mjs

      - name: Unit tests
        run: node --test tests/

      - name: Script syntax
        # Globs, not a hard-coded list: a list is one more place to forget when
        # a file is added or removed — which is exactly how this step broke.
        run: |
          for f in sw.js app/*.js assets/*.js tools/*.mjs tests/*.mjs; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done

  browser:
    name: browser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: axe, layout shift and a smoke test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/browser-check.mjs
